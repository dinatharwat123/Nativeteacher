<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Teacher | تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js" defer></script>
<style>
  :root {
    --teal-900: #04342C; --teal-800: #085041; --teal-700: #0F6E56;
    --teal-500: #1D9E75; --teal-50: #E1F5EE;
    --coral-600: #993C1D; --coral-500: #D85A30;
    --cream: #FFF8EC; --ink: #2C2622; --ink-soft: #6B5D52; --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(8,80,65,0.10);
  }
  .logo {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--teal-800);
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--coral-500); }
  .subtitle { text-align: center; color: var(--ink-soft); font-size: 14px; margin-bottom: 28px; }
  .tabs { display: flex; background: var(--teal-50); border-radius: 30px; padding: 4px; margin-bottom: 24px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 26px;
    font-size: 14px; font-weight: 500; cursor: pointer; color: var(--teal-800);
  }
  .tab.active { background: var(--teal-700); color: var(--white); }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #E4D9C8; font-family: inherit; font-size: 14px;
    background: var(--cream);
  }
  input:focus { outline: none; border-color: var(--teal-500); }
  .btn {
    width: 100%; margin-top: 22px; padding: 14px; border-radius: 30px;
    background: var(--coral-500); color: var(--white); font-weight: 500;
    font-size: 15px; border: none; cursor: pointer;
  }
  .btn:hover { opacity: 0.92; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; }
  .msg.error { color: var(--coral-600); }
  .msg.success { color: var(--teal-700); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span class="dot"></span> Native Teacher</div>
  <div class="subtitle">سجّل دخولك أو اعمل حساب جديد كطالب</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin">تسجيل الدخول</div>
    <div class="tab" id="tabSignup">حساب جديد</div>
  </div>

  <!-- تسجيل الدخول -->
  <form id="loginForm">
    <label>البريد الإلكتروني</label>
    <input type="email" id="loginEmail" required placeholder="example@email.com">
    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" required placeholder="••••••••">
    <button type="submit" class="btn">دخول</button>
  </form>

  <!-- حساب جديد -->
  <form id="signupForm" class="hidden">
    <label>الاسم بالكامل</label>
    <input type="text" id="signupName" required placeholder="اسمك">
    <label>رقم الموبايل</label>
    <input type="tel" id="signupPhone" required placeholder="01xxxxxxxxx">
    <label>البريد الإلكتروني</label>
    <input type="email" id="signupEmail" required placeholder="example@email.com">
    <label>كلمة المرور</label>
    <input type="password" id="signupPassword" required placeholder="••••••••" minlength="6">
    <button type="submit" class="btn">إنشاء الحساب</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const msg = document.getElementById('msg');

  tabLogin.onclick = () => {
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');
    msg.textContent = '';
  };
  tabSignup.onclick = () => {
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    signupForm.classList.remove('hidden'); loginForm.classList.add('hidden');
    msg.textContent = '';
  };

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.className = 'msg ' + (isError ? 'error' : 'success');
  }

  // تسجيل الدخول
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { showMsg('خطأ: ' + error.message, true); return; }
    showMsg('تم تسجيل الدخول بنجاح، جاري التحويل...', false);
    window.location.href = 'dashboard.html';
  });

  // إنشاء حساب جديد
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const full_name = document.getElementById('signupName').value;
    const phone = document.getElementById('signupPhone').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;

    // 1) اعمل حساب مصادقة (Auth)
    const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
    if (authError) { showMsg('خطأ: ' + authError.message, true); return; }

    // 2) اعمل سجل طالب مرتبط بالحساب ده
    const { error: dbError } = await supabaseClient.from('students').insert({
      auth_user_id: authData.user.id,
      full_name,
      phone,
      email,
      created_by: 'self'
    });
    if (dbError) { showMsg('خطأ في حفظ البيانات: ' + dbError.message, true); return; }

    showMsg('تم إنشاء الحساب! تفقد إيميلك لتأكيد الحساب.', false);
  });
</script>

</body>
</html>
